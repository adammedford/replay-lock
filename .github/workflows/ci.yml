name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@11.5.2

      - run: npm ci

      - run: npm run typecheck

      - name: Verify
        id: verify
        run: npm run verify -- --reporter=spec --junit="$RUNNER_TEMP/acceptance-junit.xml"

      - name: Upload acceptance failures
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-failures
          path: ${{ runner.temp }}/acceptance-junit.xml
          retention-days: 7
          # A build or package-contract failure can happen before JUnit exists.
          if-no-files-found: ignore
